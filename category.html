<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopZone - Category</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="category.css">

</head>

<body class="category-page">

    <!-- ================= HEADER ================= -->

    <header class="main-header">

        <div class="header-content">

            <div class="logo">

                <h1>
                    Shop<span>Zone</span>
                </h1>

                <p>
                    Everything You Need
                </p>

            </div>


            <nav>

                <a href="index.html#home">
                    Home
                </a>

                <a href="index.html#products">
                    Products
                </a>

                <a href="index.html#categories">
                    Categories
                </a>

                <a href="index.html#deals">
                    Deals
                </a>

                <a href="index.html#contact">
                    Contact
                </a>

            </nav>


            <div class="header-buttons">

                <button class="login-btn">
                    Login
                </button>

                <button class="cart-btn">
                    🛒 Cart
                </button>

            </div>

        </div>

    </header>


    <!-- ================= CATEGORY HEADER ================= -->

    <section class="category-page-header">

        <a
            href="index.html#products"
            class="back-button"
        >
            ← Back to ShopZone
        </a>

        <h1 id="category-title">
            Products
        </h1>

        <p id="category-description">
            Explore our complete collection.
        </p>

    </section>


    <!-- ================= SEARCH ================= -->

    <section class="search-section">

        <form id="category-search-form">

            <input
                type="text"
                id="category-search"
                placeholder="Search products..."
            >

            <button type="submit">
                Search
            </button>

        </form>

    </section>


    <!-- ================= SORTING ================= -->

    <section class="category-controls">

        <label for="category-sort">
            Sort Products:
        </label>

        <select id="category-sort">

            <option value="default">
                Default
            </option>

            <option value="price-low">
                Price: Low to High
            </option>

            <option value="price-high">
                Price: High to Low
            </option>

            <option value="rating">
                Rating
            </option>

            <option value="popularity">
                Popularity
            </option>

            <option value="discount">
                Discount
            </option>

        </select>

    </section>


    <!-- ================= PRODUCTS ================= -->

    <main id="category-products">

        <div id="category-loading">

            Loading products...

        </div>

    </main>


    <!-- ================= SCRIPT ================= -->

    <script src="script.js"></script>

    <script src="category.js"></script>

</body>

</html>
